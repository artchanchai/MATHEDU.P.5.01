<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแรก - เริ่มเรียนรู้</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* สร้างแอนิเมชันให้รูปภาพลอยขึ้นลงเบาๆ */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
        
        /* ใช้ screen เพื่อลบพื้นหลังสีดำของไฟล์ JPG ให้ดูเหมือน PNG โปร่งใส */
        .blend-screen {
            mix-blend-mode: screen;
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-black font-sans">

    <!-- วิดีโอพื้นหลัง (Video Background) -->
    <video class="absolute inset-0 w-full h-full object-cover z-0" autoplay loop muted playsinline>
        <source src="LOOP1.mp4" type="video/mp4">
        เบราว์เซอร์ของคุณไม่รองรับการแสดงผลวิดีโอ
    </video>

    <!-- เลเยอร์สีดำบางๆ ทับวิดีโอ เพื่อให้ตัวอักษรและรูปภาพโดดเด่นขึ้น -->
    <div class="absolute inset-0 bg-black/40 z-0 pointer-events-none"></div>

    <!-- รูปภาพลอยอยู่ตรงกลางด้านบน (Floating Image Top Center) -->
    <div class="absolute top-[8%] md:top-[12%] left-1/2 -translate-x-1/2 z-10 w-11/12 max-w-3xl pointer-events-none">
        <img src="B1.png" alt="ชื่อบทเรียน" class="w-full h-auto animate-float blend-screen drop-shadow-2xl">
    </div>

    <!-- ปุ่มกดตรงกลางด้านล่าง (Button Bottom Center) -->
    <div class="absolute bottom-[12%] md:bottom-[15%] left-1/2 -translate-x-1/2 z-20 w-full flex justify-center">



        <a href="code_artifact.html">
        <button class="bg-gradient-to-b from-blue-400 to-blue-600 hover:from-blue-500 hover:to-blue-700 text-white font-bold py-4 px-12 md:py-5 md:px-16 rounded-full text-2xl md:text-4xl shadow-[0_0_20px_rgba(59,130,246,0.6)] hover:shadow-[0_0_40px_rgba(59,130,246,0.9)] transition-all duration-300 transform hover:scale-110 active:scale-95 border-2 border-white/30 tracking-wide">
            เริ่มเรียนรู้
        </button>

</a>


    </div>

</body>
</html>
